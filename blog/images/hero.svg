<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Stylized globe of dots showing dense sampling in northern latitudes and sparse dots near the equator and poles">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#123a63"/>
    </linearGradient>
    <clipPath id="globe"><circle cx="600" cy="300" r="240"/></clipPath>
  </defs>
  <rect width="1200" height="600" fill="url(#sea)"/>
  <g clip-path="url(#globe)">
    <circle cx="600" cy="300" r="240" fill="#0e2f52"/>
    <!-- latitude grid -->
    <g stroke="#1d4e7e" stroke-width="1" fill="none" opacity="0.6">
      <line x1="360" y1="180" x2="840" y2="180"/>
      <line x1="360" y1="240" x2="840" y2="240"/>
      <line x1="360" y1="300" x2="840" y2="300"/>
      <line x1="360" y1="360" x2="840" y2="360"/>
      <line x1="360" y1="420" x2="840" y2="420"/>
    </g>
    <!-- dense northern band of sampling dots -->
    <g fill="#7fd4ff">
      <circle cx="470" cy="205" r="4"/><circle cx="500" cy="198" r="3"/><circle cx="530" cy="210" r="4"/>
      <circle cx="560" cy="200" r="3"/><circle cx="590" cy="212" r="4"/><circle cx="620" cy="202" r="3"/>
      <circle cx="650" cy="214" r="4"/><circle cx="680" cy="204" r="3"/><circle cx="710" cy="216" r="4"/>
      <circle cx="455" cy="235" r="3"/><circle cx="485" cy="245" r="4"/><circle cx="515" cy="232" r="3"/>
      <circle cx="545" cy="248" r="4"/><circle cx="575" cy="238" r="3"/><circle cx="605" cy="250" r="4"/>
      <circle cx="635" cy="240" r="3"/><circle cx="665" cy="252" r="4"/><circle cx="695" cy="242" r="3"/>
      <circle cx="725" cy="254" r="4"/><circle cx="440" cy="270" r="4"/><circle cx="470" cy="282" r="3"/>
      <circle cx="500" cy="268" r="4"/><circle cx="530" cy="284" r="3"/><circle cx="560" cy="272" r="4"/>
      <circle cx="590" cy="286" r="3"/><circle cx="620" cy="274" r="4"/><circle cx="650" cy="288" r="3"/>
      <circle cx="680" cy="276" r="4"/><circle cx="710" cy="290" r="3"/><circle cx="740" cy="278" r="4"/>
      <circle cx="450" cy="310" r="3"/><circle cx="480" cy="322" r="4"/><circle cx="510" cy="308" r="3"/>
      <circle cx="540" cy="324" r="4"/><circle cx="570" cy="312" r="3"/><circle cx="600" cy="326" r="4"/>
      <circle cx="630" cy="314" r="3"/><circle cx="660" cy="328" r="4"/><circle cx="690" cy="316" r="3"/>
      <circle cx="720" cy="330" r="4"/>
    </g>
    <!-- sparse equator and south -->
    <g fill="#f4b942">
      <circle cx="520" cy="352" r="3"/><circle cx="610" cy="358" r="3"/><circle cx="700" cy="350" r="3"/>
      <circle cx="480" cy="400" r="3"/><circle cx="590" cy="412" r="3"/><circle cx="680" cy="398" r="3"/>
      <circle cx="540" cy="460" r="2.5"/><circle cx="640" cy="472" r="2.5"/>
    </g>
    <!-- equator line -->
    <line x1="360" y1="300" x2="840" y2="300" stroke="#f4b942" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.8"/>
  </g>
  <circle cx="600" cy="300" r="240" fill="none" stroke="#2e6da4" stroke-width="3"/>
  <text x="600" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#e8f1f8">Who measures the ocean's plastic?</text>
  <text x="600" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#9fc3e0">GDP and the global microplastics data gap</text>
</svg>
